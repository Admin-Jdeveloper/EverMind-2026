name: MediaCompile CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Tests & Security Scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mediacompile
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
          - 9001:9001
        command: server /data --console-address ":9001"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run Secret and Security Audit Scan
        run: python execution/scan_secrets_and_deps.py

      - name: Run Backend Pytest Suite
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_SECRET_KEY: ci-test-secret-key-media-compile
          DJANGO_DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          POSTGRES_DB: mediacompile
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          REDIS_URL: redis://127.0.0.1:6379/0
          MINIO_ENDPOINT: 127.0.0.1:9000
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_BUCKET_NAME: mediacompile-uploads
          MINIO_USE_SSL: "false"
          INTERNAL_API_SECRET: development-internal-api-secret-key-must-be-min-32-chars
          INTERNAL_API_ISSUER: mediacompile-web
          INTERNAL_API_AUDIENCE: mediacompile-api
        run: |
          python -m pytest apps/api/tests/ -v

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Node Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Next.js Production Bundle
        working-directory: apps/web
        env:
          NEXTAUTH_SECRET: ci-nextauth-test-secret-min-32-chars
          NEXTAUTH_URL: http://localhost:3000
          INTERNAL_API_SECRET: development-internal-api-secret-key-must-be-min-32-chars
          INTERNAL_API_ISSUER: mediacompile-web
          INTERNAL_API_AUDIENCE: mediacompile-api
          NEXT_PUBLIC_DJANGO_API_URL: http://127.0.0.1:8000
        run: npm run build

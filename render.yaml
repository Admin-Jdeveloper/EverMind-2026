# ==============================================================================
# Evermind — Render Infrastructure Blueprint Specification
# Deploys:
#   1. evermind-api     (Django REST Framework API Web Service)
#   2. evermind-worker  (Celery Asynchronous Ingestion & Vector Embedding Worker)
#   3. evermind-web     (Next.js 16 Editorial Web Application)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. API Backend (Django REST Framework Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: evermind-api
    runtime: python
    region: oregon
    plan: starter
    buildCommand: "cd apps/api && pip install --upgrade pip && pip install -r requirements.txt && python manage.py collectstatic --noinput"
    preDeployCommand: "cd apps/api && python manage.py migrate --noinput"
    startCommand: "cd apps/api && python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --threads 2 --timeout 120"
    healthCheckPath: /api/v1/health/
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: NODE_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1,app.evermind.io,api.evermind.io"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://evermind-web.onrender.com,https://app.evermind.io"
      - key: INTERNAL_API_ISSUER
        value: evermind-web
      - key: INTERNAL_API_AUDIENCE
        value: evermind-api
      - key: STORAGE_PROVIDER
        value: s3
      - key: AWS_STORAGE_BUCKET_NAME
        value: evermind2026
      - key: AWS_S3_REGION_NAME
        value: ap-south-1
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_BASE_URL
        value: https://api.groq.com
      - key: EMBEDDING_PROVIDER
        value: local
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_DIMENSION
        value: "384"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: INTERNAL_API_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Celery Asynchronous Task Worker (Render Background Worker)
  # ----------------------------------------------------------------------------
  - type: worker
    name: evermind-worker
    runtime: python
    region: oregon
    plan: starter
    buildCommand: "cd apps/api && pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "cd apps/api && python -m celery -A config worker --loglevel=info --concurrency=4 -Q celery,ingestion,embeddings,maintenance"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: STORAGE_PROVIDER
        value: s3
      - key: AWS_STORAGE_BUCKET_NAME
        value: evermind2026
      - key: AWS_S3_REGION_NAME
        value: ap-south-1
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: EMBEDDING_PROVIDER
        value: local
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_DIMENSION
        value: "384"
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: evermind-api
          envVarKey: DJANGO_SECRET_KEY
      - key: INTERNAL_API_SECRET
        fromService:
          type: web
          name: evermind-api
          envVarKey: INTERNAL_API_SECRET
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 3. Web Frontend (Next.js 16 Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: evermind-web
    runtime: node
    region: oregon
    plan: starter
    buildCommand: "cd apps/web && npm ci && npm run build"
    startCommand: "cd apps/web && npm run start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_APP_URL
        value: https://evermind-web.onrender.com
      - key: DJANGO_API_URL
        value: https://evermind-api.onrender.com
      - key: INTERNAL_API_ISSUER
        value: evermind-web
      - key: INTERNAL_API_AUDIENCE
        value: evermind-api
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: INTERNAL_API_SECRET
        fromService:
          type: web
          name: evermind-api
          envVarKey: INTERNAL_API_SECRET

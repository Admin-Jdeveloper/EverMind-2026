services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mediacompile-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mediacompile}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-mediacompile}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - mediacompile-net

  redis:
    image: redis:7-alpine
    container_name: mediacompile-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - mediacompile-net

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: mediacompile-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - mediacompile-net

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    container_name: mediacompile-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-mediacompile-uploads}
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb local/$${MINIO_BUCKET_NAME:-mediacompile-uploads} --ignore-existing &&
      echo 'MinIO bucket initialized successfully.'
      "
    restart: "no"
    networks:
      - mediacompile-net

volumes:
  postgres_data:
    name: mediacompile_postgres_data
  redis_data:
    name: mediacompile_redis_data
  minio_data:
    name: mediacompile_minio_data

networks:
  mediacompile-net:
    name: mediacompile-net
    driver: bridge

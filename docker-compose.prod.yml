# ==============================================================================
# Evermind — Production Docker Compose Override
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Connects containerized application services (Web, API, Worker)
# directly to real external production infrastructure (Managed Postgres,
# Managed Redis, AWS S3) without running local development database/storage containers.
# ==============================================================================

services:
  # Disable local development state containers in external production mode
  postgres:
    profiles: ["dev-only"]
    deploy:
      replicas: 0

  redis:
    profiles: ["dev-only"]
    deploy:
      replicas: 0

  minio:
    profiles: ["dev-only"]
    deploy:
      replicas: 0

  minio-init:
    profiles: ["dev-only"]
    deploy:
      replicas: 0

  # ----------------------------------------------------------------------------
  # 1. Web Frontend (Next.js 16 Application)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    container_name: evermind-prod-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - ENVIRONMENT=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - DJANGO_API_URL=${DJANGO_API_URL:-http://api:8000}
      - AUTH_SECRET=${AUTH_SECRET}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - INTERNAL_API_ISSUER=evermind-web
      - INTERNAL_API_AUDIENCE=evermind-api
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - mediacompile-net

  # ----------------------------------------------------------------------------
  # 2. API Backend (Django REST Framework)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    container_name: evermind-prod-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - NODE_ENV=production
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api,web}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-${REDIS_URL}}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-${REDIS_URL}}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-s3}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-evermind2026}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - INTERNAL_API_ISSUER=evermind-web
      - INTERNAL_API_AUDIENCE=evermind-api
      - RUN_MIGRATIONS=true
      - COLLECT_STATIC=true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/v1/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mediacompile-net

  # ----------------------------------------------------------------------------
  # 3. Celery Background Worker
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    container_name: evermind-prod-worker
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=4", "-Q", "celery,ingestion,embeddings,maintenance"]
    environment:
      - ENVIRONMENT=production
      - NODE_ENV=production
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-${REDIS_URL}}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-${REDIS_URL}}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-s3}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-evermind2026}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - INTERNAL_API_ISSUER=evermind-web
      - INTERNAL_API_AUDIENCE=evermind-api
      - RUN_MIGRATIONS=false
      - COLLECT_STATIC=false
    networks:
      - mediacompile-net
